<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560"
     role="img" aria-label="Sepet mimarisi: fişin fotoğrafı iPhone'dan çıkmıyor; sunucuya yalnızca eşleşmiş satırlar gidiyor ve endeks Postgres fonksiyonlarında hesaplanıyor.">
  <defs>
