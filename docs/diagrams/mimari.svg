  <text x="360" y="46" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#7A7975">SUNUCU · RENDER</text>
  <text x="680" y="46" font-family="ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#7A7975">VERİTABANI · NEON</text>

