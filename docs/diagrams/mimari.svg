      <path d="M0 0 L10 5 L0 10 z" fill="#16181A"/>
    </marker>
    <marker id="okGri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7A7975"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#F7F6F3"/>

