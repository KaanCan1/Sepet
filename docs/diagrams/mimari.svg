  <rect x="62" y="102" width="206" height="44" rx="8" fill="#F7F6F3" stroke="#E8E6E1"/>
  <text x="165" y="129" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#16181A">Kamera · fiş fotoğrafı</text>

  <rect x="62" y="172" width="206" height="54" rx="8" fill="#F7F6F3" stroke="#E8E6E1"/>
  <text x="165" y="194" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#16181A">Apple Vision OCR</text>
