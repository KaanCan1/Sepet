  <line x1="40" y1="500" x2="40" y2="516" stroke="#16181A" stroke-width="3"/>
  <text x="54" y="512" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7A7975">Kesikli çerçeve: cihaz sınırı  ·  Kesikli ok: henüz yok  ·  Mavi kutu: ürünün kalbi</text>
</svg>
