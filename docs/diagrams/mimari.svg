  <text x="800" y="489" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7A7975">TCMB EVDS</text>
  <text x="800" y="504" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#7A7975">planlanan otomatik çekim</text>
  <line x1="800" y1="468" x2="800" y2="404" stroke="#7A7975" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#okGri)"/>

