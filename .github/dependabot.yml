version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    # Her paket için ayrı PR yerine tek toplu PR — tek CI turu, tek inceleme.
    groups:
      pub:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
