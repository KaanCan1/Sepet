name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Aynı dal için yeni push gelirse önceki koşuyu iptal et.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.1'

jobs:
  analyze:
    name: Analiz ve test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim
        run: dart format --output=none --set-exit-if-changed .

      - name: Statik analiz
        run: flutter analyze --fatal-infos

      - name: Testler
        run: flutter test --coverage --reporter expanded

      - name: Kapsam raporunu yükle
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  android:
    name: Android derleme
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # İmzasız release APK — mağaza yüklemesi için değil, derlemenin
      # bozulmadığını ve indirilebilir bir çıktı olduğunu doğrulamak için.
      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sepet-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS derleme
    needs: analyze
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # CI'da imzalama sertifikası yok; --no-codesign derlemeyi yine de doğrular.
      - name: iOS
        run: flutter build ios --release --no-codesign
