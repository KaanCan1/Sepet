name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Aynı dal için yeni push gelirse önceki koşuyu iptal et.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analiz ve test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Sürüm .fvmrc'de tanımlı; yerel ile CI'ın ayrışmaması için oradan okunuyor.
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Biçim
        run: dart format --output=none --set-exit-if-changed .

      - name: Statik analiz
        run: flutter analyze --fatal-infos

      - name: Testler
        run: flutter test --coverage --reporter expanded

      - name: Kapsam raporunu yükle
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  android:
    name: Android derleme
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Sürüm .fvmrc'de tanımlı; yerel ile CI'ın ayrışmaması için oradan okunuyor.
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # İmzasız release APK — mağaza yüklemesi için değil, derlemenin
      # bozulmadığını ve indirilebilir bir çıktı olduğunu doğrulamak için.
      - name: APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: sepet-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS derleme
    needs: analyze
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Sürüm .fvmrc'de tanımlı; yerel ile CI'ın ayrışmaması için oradan okunuyor.
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - run: flutter pub get

      # CI'da imzalama sertifikası yok; --no-codesign derlemeyi yine de doğrular.
      - name: iOS
        run: flutter build ios --release --no-codesign

  server:
    name: Sunucu — şema ve endeks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sepet
          POSTGRES_PASSWORD: sepet
          POSTGRES_DB: sepet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sepet -d sepet"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://sepet:sepet@localhost:5432/sepet
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Tip denetimi CI'da hiç çalışmıyordu; bir tip hatası fark edilmeden
      # birleşti. Testler geçiyor olması TypeScript'in mutlu olduğu
      # anlamına gelmiyor — tsx tipleri kontrol etmeden çalıştırıyor.
      - name: Tip denetimi
        run: npm run typecheck

      - name: Migration'lar
        run: npm run migrate:up

      # Aşağı yönlü migration'ların da çalıştığını doğrula: geri alınamayan
      # şema değişikliği fark edilmeden birikmesin.
      - name: Geri alma denemesi
        run: |
          npm run migrate -- down 7
          npm run migrate:up

      - name: Katalog ve demo veri
        run: |
          npm run catalog
          npm run seed

      - name: Endeks ve API testleri
        run: npm test

  # Render'ın yaptığını birebir tekrar eder. Sebebi somut: NODE_ENV=production
  # altında "npm ci" devDependencies'i atlıyor, node-pg-migrate orada durduğu
  # için başlatma komutu "not found" ile ölüyordu ve iki dağıtım üst üste bu
  # yüzden battı. Normal "server" işi devDependencies'le kurduğu için bunu
  # göremiyor.
  deploy-check:
    name: Sunucu — üretim kurulumu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sepet
          POSTGRES_PASSWORD: sepet
          POSTGRES_DB: sepet
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sepet -d sepet"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://sepet:sepet@localhost:5432/sepet?sslmode=disable
      JWT_SECRET: ci-testi-icin-gecici-anahtar
      DEV_LOGIN: 'true'
      DEV_LOGIN_EMAILS: demo@sepet.app
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # render.yaml'daki buildCommand ile aynı, NODE_ENV=production altında.
      - run: npm ci

      # startCommand'ın ilk yarısı.
      - name: Başlatma hazırlığı
        run: npm run deploy:prepare

      # İkinci yarısı: süreç gerçekten ayağa kalkıyor ve /health cevap veriyor mu.
      - name: Sunucu açılıyor mu
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then
              echo && echo "sunucu ayakta" && exit 0
            fi
            sleep 2
          done
          echo "sunucu 60 saniyede açılmadı" >&2
          exit 1
