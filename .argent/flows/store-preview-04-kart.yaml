steps:
  - echo: >-
      4/5 — Kartın açılışı. DİBE KADAR kaydırılıyor, tek kaydırmayla değil:
      momentum nerede durduğunu belirsiz bırakıyor ve satır ıskalanıyor. Dip
      sabit bir çapa. "Eylül kartı · PAYLAŞ" satırı dipteyken (0.5, 0.601).

      Kartın kendisi AYRI bir segmentte duruyor. Sebebi durum çubuğu:
      argent her akış bitiminde `simctl status_bar clear` çağırıyor, yani
      kayıt akışı aşarsa temizleme klibin içine düşüyor. Bu klip akışın
      bittiği yerde bitiyor; kartın ekranda beklemesi sonraki segmentte.
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.80, toX: 0.5, toY: 0.28, durationMs: 600 }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.80, toX: 0.5, toY: 0.28, durationMs: 600 }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.80, toX: 0.5, toY: 0.28, durationMs: 600 }
  - wait: 1200
  - tool: gesture-tap
    args: { x: 0.5, y: 0.601 }
  - wait: 900
