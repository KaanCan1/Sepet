steps:
  - echo: >-
      SEÇİCİ NOTU — bu akışlar metin değil koordinat kullanıyor. argent akış
      adımlarını DYLD_INSERT_LIBRARIES ile enjekte ettiği native köprü
      üzerinden çalıştırıyor; Flutter her şeyi tek bir FlutterView tuvaline
      çizdiği için o köprüde eşleşecek UIKit metni yok. "argent run describe"
      ax-service kullandığı için metinleri görüyor, akış çalıştırıcısı
      görmüyor. Aşağıdaki oranlar o describe çıktısından, iPhone 17 Pro Max
      üzerinde ölçüldü.
  - launch: com.kaancankurt.sepet
  - echo: Soğuk açılış + ağ üzerinden dev-login + üç paralel istek.
  - wait: 9000
  - await:
      idle: true
  - echo: Alt sekme çubuğu — Fişler (0.328, 0.935).
  - tap: { x: 0.328, y: 0.935 }
  - wait: 2000
  - echo: >-
      19 Temmuz BİM fişi, 16 kalem. Daha kalabalık fişler var (6 Ağustos
      Migros, 29 kalem) ama onlar ekranın altından taşıyor; bu fiş başlıktan
      barkoda kadar tamamen sığıyor — TOPLAM, "TEŞEKKÜR EDERİZ" ve koparma
      kenarı dahil. Mağaza karesinde kesilmemiş fiş, kalabalık fişten iyi.
      Satır merkezi (0.5, 0.3115); liste tarihe göre sabit sırada. Sade
      yerleşimde cam bar kalkıp yerine kayan büyük başlık geldi ve liste
      biraz aşağı indi — oran 0.306'ydı.
  - tap: { x: 0.5, y: 0.3115 }
  - wait: 2000
  - await:
      idle: true
